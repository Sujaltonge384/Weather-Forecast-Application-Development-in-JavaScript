<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-tight">Weather Dashboard</h1>
    </header>

    <main class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-slate-800 text-lg mb-4">Search Location</h2>
                
                <div class="flex flex-col space-y-4">
                    <input type="text" id="city-input" placeholder="E.g., New York, London, Tokyo" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                    
                    <button id="search-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                        Search
                    </button>
                    
                    <div class="flex items-center justify-center space-x-2 text-slate-400 text-sm">
                        <hr class="w-full border-slate-200">
                        <span>or</span>
                        <hr class="w-full border-slate-200">
                    </div>
                    
                    <button id="location-btn" class="w-full bg-slate-500 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                        Use Current Location
                    </button>
                </div>
            </div>

            <div id="history-container" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-slate-800 text-lg mb-4">Recent Searches</h2>
                <ul id="history-list" class="flex flex-col space-y-2"></ul>
            </div>
        </aside>

       <section class="lg:col-span-3 space-y-6">
            
            <div id="current-weather-card" class="hidden bg-indigo-500 text-white p-6 md:p-8 rounded-xl shadow-md flex-col md:flex-row justify-between items-center relative overflow-hidden">
                
                <div class="z-10 flex flex-col space-y-3 w-full md:w-2/3">
                    <h2 id="current-city-date" class="text-2xl md:text-3xl font-bold">City Name (YYYY-MM-DD)</h2>
                    
                    <div class="flex items-end space-x-4">
                        <p class="text-4xl md:text-5xl font-extrabold tracking-tighter">
                            <span id="current-temp">--</span>
                            <span id="temp-unit" class="text-2xl md:text-3xl font-bold">°C</span>
                        </p>
                        <button id="toggle-unit-btn" class="mb-1 text-xs bg-indigo-700 hover:bg-indigo-800 px-2 py-1 rounded shadow transition-colors">
                            Switch to °F
                        </button>
                    </div>

                    <div class="space-y-1 mt-4 text-indigo-100">
                        <p class="font-medium text-lg">Wind: <span id="current-wind">--</span> M/S</p>
                        <p class="font-medium text-lg">Humidity: <span id="current-humidity">--</span>%</p>
                    </div>
                </div>

                <div class="z-10 mt-6 md:mt-0 w-full md:w-1/3 flex justify-center md:justify-end">
                    <img id="current-icon" src="" alt="Weather Icon" class="w-32 h-32 object-contain hidden">
                    <p id="current-desc" class="text-center font-medium capitalize mt-2"></p>
                </div>
            </div>

            <div id="initial-message" class="bg-indigo-50 border border-indigo-100 text-indigo-800 p-8 rounded-xl shadow-sm flex justify-center items-center h-48">
                <p class="text-lg font-medium">Search for a city or use your location to see the weather forecast.</p>
            </div>

            <div id="forecast-section" class="hidden">
                <h3 class="font-bold text-2xl mb-4 text-slate-800">5-Day Forecast</h3>
                
                <div id="forecast-cards-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                    </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
